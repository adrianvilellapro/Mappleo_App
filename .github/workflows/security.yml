name: Tests and security
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mappleo-ci
          POSTGRES_DB: mappleo
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d mappleo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/prepare-ci.ts
      - run: npm run db:generate && npm run security:prepare
      - run: npm run encryption:prepare
      - run: npm run admin:prepare
      - run: npm run registration:prepare
      - run: npm run test:prepare
      - run: node --env-file=.env.test node_modules/prisma/build/index.js migrate deploy
      - run: npm run security:prepare:test
      - run: npm run lint && npm run typecheck && npm test && npm run test:integration
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run demo:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      - run: npm run test:e2e
        id: e2e
      - name: Preserve failed browser diagnostics
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
